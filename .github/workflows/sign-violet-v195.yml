name: Check FlipCheck signing availability
on:
  push:
    branches: [codex/sign-violet-v195]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.FLIPCHECK_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.FLIPCHECK_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.FLIPCHECK_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.FLIPCHECK_KEY_PASSWORD }}
    steps:
      - name: Verify release signing is configured
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo 'Release signing credentials are available to this workflow.'
