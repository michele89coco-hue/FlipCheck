name: FlipCheck v1.31 canonical APK

on:
  push:
    branches:
      - codex/v1.31-universal-evidence-closure-recovery
  pull_request:
    branches:
      - codex/v1.29-universal-catalog-evidence
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  canonical-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FLIPCHECK_KEYSTORE_PATH: ${{ github.workspace }}/flipcheck-compatible.jks
      FLIPCHECK_KEYSTORE_PASSWORD: ${{ secrets.FLIPCHECK_KEYSTORE_PASSWORD }}
      FLIPCHECK_KEY_ALIAS: ${{ secrets.FLIPCHECK_KEY_ALIAS }}
      FLIPCHECK_KEY_PASSWORD: ${{ secrets.FLIPCHECK_KEY_PASSWORD }}
      # Stable repository key used by v1.28 through v1.31; canonical branch build.
      EXPECTED_CERT_SHA256: d4d02478ea31cb6bd83228047e9accd7dfb191ed991a4c8e8c06a228e54614c7
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Install declared Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Restore stable repository signing key
        env:
          FLIPCHECK_KEYSTORE_BASE64: ${{ secrets.FLIPCHECK_KEYSTORE_BASE64 }}
        run: |
          test -n "$FLIPCHECK_KEYSTORE_BASE64"
          test -n "$FLIPCHECK_KEYSTORE_PASSWORD"
          test -n "$FLIPCHECK_KEY_ALIAS"
          test -n "$FLIPCHECK_KEY_PASSWORD"
          printf '%s' "$FLIPCHECK_KEYSTORE_BASE64" | tr -d '\n' | base64 -d > "$FLIPCHECK_KEYSTORE_PATH"

      - name: Canonical Gradle build, regressions and lint
        run: ./gradlew clean :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --console=plain --stacktrace

      - name: Analyze, verify and stage exact APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=artifact
          mkdir -p "$OUT"
          cp "$APK" "$OUT/FlipCheck-v1.31.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$OUT/FlipCheck-v1.31.apk" | tee "$OUT/apksigner-report.txt"
          CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$OUT/apksigner-report.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$OUT/FlipCheck-v1.31.apk" | tee "$OUT/apk-analyzer-report.txt"
          grep -q "package: name='com.flipcheck.beta.nativev098.clean.debug' versionCode='135' versionName='1.31-universal-evidence-closure-recovery'" "$OUT/apk-analyzer-report.txt"
          unzip -l "$OUT/FlipCheck-v1.31.apk" | tee -a "$OUT/apk-analyzer-report.txt"
          sha256sum "$OUT/FlipCheck-v1.31.apk" | tee "$OUT/FlipCheck-v1.31.sha256"
          printf 'UPDATE_COMPATIBLE_WITH_V1_29=true\nV1_29_AND_V1_30_CERT_SHA256=%s\n' "$CERT" > "$OUT/signing-compatibility.txt"
          cp app/build/test-results/testDebugUnitTest/*.xml "$OUT/"
          java -version 2> "$OUT/build-environment.txt"
          ./gradlew --version >> "$OUT/build-environment.txt"
          printf 'compileSdk=36\ntargetSdk=36\nbuildTools=36.0.0\nversionCode=135\nversionName=1.31-universal-evidence-closure-recovery\ncommit=%s\n' "$GITHUB_SHA" >> "$OUT/build-environment.txt"
          if [ -f app/build/reports/lint-results-debug.html ]; then
            cp app/build/reports/lint-results-debug.html artifact/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: FlipCheck-v1.31-canonical-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
