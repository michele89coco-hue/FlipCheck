name: FlipCheck 26 targeted fixes
on:
  push:
    branches: [codex/v0262-google-visual, codex/v0262-evidence-recovery-177, codex/v0262-background-quality-178, codex/v0262-photo-evidence-179, codex/v0262-key-evidence-180, codex/v0262-evidence-181, codex/card-box-closure-182, codex/universal-key-closure-183, codex/format-serial-closure-184, codex/checklist-slab-serial-185, codex/checklist-evidence-repair-186, codex/slab-alias-checklist-187, codex/evidence-priority-188, codex/release-evidence-189, codex/release-ocr-190, codex/identity-final-191, codex/identity-final-192, codex/catalogue-engine-193, codex/catalogue-language-separation, codex/state-fixes-195, codex/card-recognition-196, codex/diagnostic-export-197, codex/catalogue-resolution-198, codex/physical-details-199, codex/identity-completion-200, codex/verified-identity-201, codex/recognition-202, codex/pokemon-number-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLIPCHECK_KEYSTORE_PATH: ${{ github.workspace }}/flipcheck-compatible.jks
      FLIPCHECK_KEYSTORE_PASSWORD: ${{ secrets.FLIPCHECK_KEYSTORE_PASSWORD }}
      FLIPCHECK_KEY_ALIAS: ${{ secrets.FLIPCHECK_KEY_ALIAS }}
      FLIPCHECK_KEY_PASSWORD: ${{ secrets.FLIPCHECK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Targeted policy checks without live API
        run: node --test legacy26/tests/editions.test.cjs legacy26/tests/visual-policy.test.cjs legacy26/tests/identity-repair.test.cjs legacy26/tests/evidence-regression.test.cjs legacy26/tests/evidence-priority.test.cjs legacy26/tests/card-keys.test.cjs legacy26/tests/evidence-closure.test.cjs legacy26/tests/universal-closure.test.cjs legacy26/tests/format-serial.test.cjs legacy26/tests/checklist-slab.test.cjs legacy26/tests/real-evidence.test.cjs legacy26/tests/priority-closure.test.cjs legacy26/tests/identity-release.test.cjs legacy26/tests/ocr-keys-release.test.cjs legacy26/tests/reference-release.test.cjs legacy26/tests/slab-identity-191.test.cjs legacy26/tests/image-evidence-192.test.cjs legacy26/tests/catalogue-engine.test.cjs legacy26/tests/catalogue-196.test.cjs legacy26/tests/catalogue-198.test.cjs legacy26/tests/catalogue-199.test.cjs legacy26/tests/catalogue-200.test.cjs legacy26/tests/catalogue-201.test.cjs legacy26/tests/catalogue-202.test.cjs legacy26/tests/pokemon-number-identity.test.cjs legacy26/tests/pokemon-photo-keys-204.test.cjs
      - name: Browser integration without live API
        run: |
          npm install --prefix /tmp/flipcheck26-tests playwright@1.62.1 --no-audit --no-fund
          /tmp/flipcheck26-tests/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/flipcheck26-tests/node_modules node --test legacy26/tests/browser.test.cjs legacy26/tests/catalogue-browser.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: android-actions/setup-android@v3
      - name: Install declared Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore signing key
        env:
          FLIPCHECK_KEYSTORE_BASE64: ${{ secrets.FLIPCHECK_KEYSTORE_BASE64 }}
        run: |
          test -n "$FLIPCHECK_KEYSTORE_BASE64"
          printf '%s' "$FLIPCHECK_KEYSTORE_BASE64" | tr -d '\n' | base64 -d > "$FLIPCHECK_KEYSTORE_PATH"
      - name: Build and verify signed release APK
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          ./gradlew :legacy26:assembleRelease :legacy26:assembleReleaseAndroidTest --no-daemon --console=plain
          mkdir -p artifact
          cp legacy26/build/outputs/apk/release/legacy26-release.apk artifact/FlipCheck-v0.29.11-Pokemon-204.apk
          sha256sum artifact/FlipCheck-v0.29.11-Pokemon-204.apk > artifact/FlipCheck-v0.29.11-Pokemon-204.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifact/FlipCheck-v0.29.11-Pokemon-204.apk > artifact/apksigner-report.txt
          grep -q 'Signer #1 certificate SHA-256 digest: d4d02478ea31cb6bd83228047e9accd7dfb191ed991a4c8e8c06a228e54614c7' artifact/apksigner-report.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifact/FlipCheck-v0.29.11-Pokemon-204.apk > artifact/apk-analyzer-report.txt
          grep -q "package: name='com.flipcheck.beta.legacy26fix' versionCode='204' versionName='0.29.11-photo-keys'" artifact/apk-analyzer-report.txt
          if grep -q 'application-debuggable' artifact/apk-analyzer-report.txt; then exit 1; fi
          cp /tmp/flipcheck26-printing.png artifact/browser-printing.png
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Android 16 background, navigation and photo-picker checks without API
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: bash legacy26/tests/run-android-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlipCheck-v026-targeted-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 14
