name: FlipCheck identification state checks
on:
  push:
    branches: [codex/slab-state-consistency]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-identification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Targeted policy checks without live API
        run: node --test legacy26/tests/editions.test.cjs legacy26/tests/visual-policy.test.cjs legacy26/tests/identity-repair.test.cjs legacy26/tests/evidence-regression.test.cjs legacy26/tests/evidence-priority.test.cjs legacy26/tests/card-keys.test.cjs legacy26/tests/evidence-closure.test.cjs legacy26/tests/universal-closure.test.cjs legacy26/tests/format-serial.test.cjs legacy26/tests/checklist-slab.test.cjs legacy26/tests/real-evidence.test.cjs legacy26/tests/priority-closure.test.cjs legacy26/tests/identity-release.test.cjs legacy26/tests/ocr-keys-release.test.cjs legacy26/tests/reference-release.test.cjs legacy26/tests/slab-identity-191.test.cjs legacy26/tests/image-evidence-192.test.cjs legacy26/tests/catalogue-engine.test.cjs legacy26/tests/pokemon-number-identity.test.cjs legacy26/tests/pokemon-photo-keys-204.test.cjs legacy26/tests/lens-205.test.cjs
      - name: Browser integration without live API
        run: |
          npm install --prefix /tmp/flipcheck26-tests playwright@1.62.1 --no-audit --no-fund
          /tmp/flipcheck26-tests/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/flipcheck26-tests/node_modules node --test legacy26/tests/browser.test.cjs legacy26/tests/catalogue-browser.test.cjs
