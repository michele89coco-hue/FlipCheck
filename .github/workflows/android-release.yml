name: Android Signed APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/retain-builds.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    env:
      FLIPCHECK_KEYSTORE_PATH: ${{ github.workspace }}/flipcheck-release.jks
      FLIPCHECK_KEYSTORE_PASSWORD: ${{ secrets.FLIPCHECK_KEYSTORE_PASSWORD }}
      FLIPCHECK_KEY_ALIAS: ${{ secrets.FLIPCHECK_KEY_ALIAS }}
      FLIPCHECK_KEY_PASSWORD: ${{ secrets.FLIPCHECK_KEY_PASSWORD }}
      FLIPCHECK_KEYSTORE_BASE64: ${{ secrets.FLIPCHECK_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore release keystore
        shell: bash
        run: |
          if [ -z "${FLIPCHECK_KEYSTORE_BASE64}" ]; then
            echo "Manca FLIPCHECK_KEYSTORE_BASE64 nei secrets di GitHub."
            exit 1
          fi
          echo "${FLIPCHECK_KEYSTORE_BASE64}" | tr -d '\n' | base64 -d > "${FLIPCHECK_KEYSTORE_PATH}"

      - name: Run Android release build
        env:
          FLIPCHECK_KEYSTORE_PATH: ${{ github.workspace }}/flipcheck-release.jks
          FLIPCHECK_KEYSTORE_PASSWORD: ${{ secrets.FLIPCHECK_KEYSTORE_PASSWORD }}
          FLIPCHECK_KEY_ALIAS: ${{ secrets.FLIPCHECK_KEY_ALIAS }}
          FLIPCHECK_KEY_PASSWORD: ${{ secrets.FLIPCHECK_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon assembleRelease
          else
            gradle --no-daemon assembleRelease
          fi

      - name: Stage APK for upload
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          for apk in app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk")"
            cp "$apk" "$GITHUB_WORKSPACE/artifact/${base%.apk}-${GITHUB_SHA}.apk"
          done
          echo "$GITHUB_SHA" > "$GITHUB_WORKSPACE/artifact/build-commit.txt"
          echo "run_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_WORKSPACE/artifact/build-commit.txt"
          echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_WORKSPACE/artifact/build-commit.txt"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: flipcheck-release-apk-${{ github.run_number }}-${{ github.sha }}
          path: artifact/*.apk
          retention-days: 30

