name: Publish exact FlipCheck 240 APK
on:
  push:
    branches: [release/fix240-20261007-no-ai]
    paths:
      - .github/workflows/publish240-exact.yml
      - release-artifacts/fix240/**
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-artifacts/fix240
      - name: Restore verified public release bundle
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import json,hashlib,zipfile
          root=Path('release-artifacts/fix240');m=json.loads((root/'bundle240.json').read_text());assert m['format']=='flipcheck-public-release-bundle-v1'
          parts=[]
          for c in m['chunks']:
            b=(root/c['path']).read_bytes();assert len(b)==c['bytes'] and hashlib.sha256(b).hexdigest()==c['sha256'];parts.append(b)
          data=b''.join(parts);assert len(data)==m['bytes'] and hashlib.sha256(data).hexdigest()==m['sha256']
          path=root/'publish240-bundle.zip';path.write_bytes(data)
          with zipfile.ZipFile(path) as z:
            assert z.testzip() is None and all('/' not in n and '\\' not in n for n in z.namelist())
            z.extractall(root)
          PYCODE
      - name: Download verified 239 and reconstruct exact signed 240
        shell: bash
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 --output /tmp/FlipCheck239.apk https://github.com/michele89coco-hue/FlipCheck/releases/download/fix239-20261007-no-ai/FlipCheck239-dettagli-discriminanti-no-AI.apk
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y zstd; fi
          python release-artifacts/fix240/reconstruct240.py /tmp/FlipCheck239.apk release-artifacts/fix240/FlipCheck240-reconstruction.zip release-artifacts/fix240/FlipCheck240-gemini-schema-no-AI.apk
          cd release-artifacts/fix240
          sha256sum --check SHA256SUMS-240.txt
      - name: Upload and verify assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python release-artifacts/fix240/publish_release240.py
