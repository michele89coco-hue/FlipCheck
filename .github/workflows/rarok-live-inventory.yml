name: RAROK live configuration inventory
on:
  push:
    branches: [codex/rarok-live-readiness]
    paths: [.github/workflows/rarok-live-inventory.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report available configuration names only
        env:
          CONFIGURATION_INPUT: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PY'
          import json, os
          configuration = json.loads(os.environ.pop('CONFIGURATION_INPUT', '{}'))
          names = sorted(k for k in configuration if k != 'github_token' and k.upper() != 'GITHUB_TOKEN')
          print('RAROK_CONFIG_NAMES=' + json.dumps(names))
          print('RAROK_SCOPE=SECRET_NAMES_ONLY_NO_VALUES_NO_LIVE_SCANS')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Available configuration names only; no secret values or card scans.\n\n')
              for name in names:
                  output.write('- ' + name + '\n')
          PY
