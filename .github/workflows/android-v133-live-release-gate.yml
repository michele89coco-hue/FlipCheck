name: FlipCheck v1.33 installed APK live release gate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  installed-live-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      FLIPCHECK_KEYSTORE_PATH: ${{ github.workspace }}/flipcheck-compatible.jks
      FLIPCHECK_KEYSTORE_PASSWORD: ${{ secrets.FLIPCHECK_KEYSTORE_PASSWORD }}
      FLIPCHECK_KEY_ALIAS: ${{ secrets.FLIPCHECK_KEY_ALIAS }}
      FLIPCHECK_KEY_PASSWORD: ${{ secrets.FLIPCHECK_KEY_PASSWORD }}
      FLIPCHECK_LIVE_API_KEY: ${{ secrets.FLIPCHECK_LIVE_API_KEY }}
      EXPECTED_CERT_SHA256: d4d02478ea31cb6bd83228047e9accd7dfb191ed991a4c8e8c06a228e54614c7
      PACKAGE: com.flipcheck.beta.nativev098.clean.debug
      TEST_PACKAGE: com.flipcheck.beta.nativev098.clean.debug.test
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Install declared Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'

      - name: Require live and signing credentials
        run: |
          test -n "$FLIPCHECK_LIVE_API_KEY"
          test -n "$FLIPCHECK_KEYSTORE_PASSWORD"
          test -n "$FLIPCHECK_KEY_ALIAS"
          test -n "$FLIPCHECK_KEY_PASSWORD"

      - name: Restore compatible signing key
        env:
          FLIPCHECK_KEYSTORE_BASE64: ${{ secrets.FLIPCHECK_KEYSTORE_BASE64 }}
        run: |
          test -n "$FLIPCHECK_KEYSTORE_BASE64"
          printf '%s' "$FLIPCHECK_KEYSTORE_BASE64" | tr -d '\n' | base64 -d > "$FLIPCHECK_KEYSTORE_PATH"

      - name: Build deterministic tests and exact candidate APK
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          ./gradlew clean :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain --stacktrace
          mkdir -p artifact
          touch artifact/unit-replay.pass
          cp app/build/outputs/apk/debug/app-debug.apk artifact/FlipCheck-v1.33.apk
          sha256sum artifact/FlipCheck-v1.33.apk | tee artifact/FlipCheck-v1.33.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifact/FlipCheck-v1.33.apk | tee artifact/apksigner-report.txt
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' artifact/apksigner-report.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$cert" = "$EXPECTED_CERT_SHA256"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifact/FlipCheck-v1.33.apk | tee artifact/apk-analyzer-report.txt
          grep -q "package: name='$PACKAGE' versionCode='137' versionName='1.33-live-validated-global-resolver'" artifact/apk-analyzer-report.txt
          ! unzip -l artifact/FlipCheck-v1.33.apk | grep -Eq 'topps-front|kobe-(front|back)|vileplume-front|philips-front'

      - name: Install exact APK and execute 12 uncached live runs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -t artifact/FlipCheck-v1.33.apk | tee artifact/install-exact-apk.txt
            grep -q Success artifact/install-exact-apk.txt
            touch artifact/apk-installation.pass
            adb install -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | tee artifact/install-test-apk.txt
            grep -q Success artifact/install-test-apk.txt
            adb shell pm grant "$PACKAGE" android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop "$PACKAGE"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 | tee artifact/launch.txt
            sleep 5
            test -n "$(adb shell pidof "$PACKAGE" | tr -d '\r')"
            adb exec-out screencap -p > artifact/installed-candidate-launch.png
            touch artifact/apk-launch.pass
            adb shell am force-stop "$PACKAGE"
            set +e
            adb shell am instrument -w -r -e live_api_key "$FLIPCHECK_LIVE_API_KEY" -e class com.flipcheck.nativebeta.LiveRegressionSuite "$TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" | tee artifact/live-instrumentation.txt
            instrumentation_status=${PIPESTATUS[0]}
            set -e
            adb pull "/sdcard/Android/data/$PACKAGE/files/v133-live" artifact/live || true
            test "$instrumentation_status" -eq 0
            grep -q 'OK (1 test)' artifact/live-instrumentation.txt
            touch artifact/live-instrumentation.pass

      - name: Enforce fail-closed release gate
        if: always()
        run: |
          flags=()
          if [[ -f artifact/unit-replay.pass ]]; then flags+=(--unit-pass --replay-pass); fi
          if [[ -f artifact/apk-installation.pass ]]; then flags+=(--apk-installation-pass); fi
          if [[ -f artifact/apk-launch.pass ]]; then flags+=(--apk-launch-pass); fi
          python3 tools/release/v133_release_gate.py \
            --apk artifact/FlipCheck-v1.33.apk \
            --live-report artifact/live/v133-live-results.json \
            --output artifact/v133-release-gate.json \
            "${flags[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlipCheck-v1.33-live-gate-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
