name: FlipCheck build157 four-stage APK

on:
  push:
    branches: [codex/v1.36-independent-reading-build157]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FLIPCHECK_KEYSTORE_PATH: ${{ github.workspace }}/flipcheck-compatible.jks
      FLIPCHECK_KEYSTORE_PASSWORD: ${{ secrets.FLIPCHECK_KEYSTORE_PASSWORD }}
      FLIPCHECK_KEY_ALIAS: ${{ secrets.FLIPCHECK_KEY_ALIAS }}
      FLIPCHECK_KEY_PASSWORD: ${{ secrets.FLIPCHECK_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: d4d02478ea31cb6bd83228047e9accd7dfb191ed991a4c8e8c06a228e54614c7
      PACKAGE: com.flipcheck.beta.nativev098.clean.debug
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Install declared Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore compatible signing key
        env:
          FLIPCHECK_KEYSTORE_BASE64: ${{ secrets.FLIPCHECK_KEYSTORE_BASE64 }}
        run: |
          test -n "$FLIPCHECK_KEYSTORE_BASE64"
          test -n "$FLIPCHECK_KEYSTORE_PASSWORD"
          test -n "$FLIPCHECK_KEY_ALIAS"
          test -n "$FLIPCHECK_KEY_PASSWORD"
          printf '%s' "$FLIPCHECK_KEYSTORE_BASE64" | tr -d '\n' | base64 -d > "$FLIPCHECK_KEYSTORE_PATH"

      - name: Compile and sign APK without live API tests
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          ./gradlew :app:testDebugUnitTest --tests "*V157*" --tests "*V156*" --tests "*V155*" --tests "*V154*" --tests "*V153*" :app:assembleDebug --no-daemon --console=plain --stacktrace
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/FlipCheck-v1.35-build157.apk
          sha256sum artifact/FlipCheck-v1.35-build157.apk | tee artifact/FlipCheck-v1.35-build157.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifact/FlipCheck-v1.35-build157.apk | tee artifact/apksigner-report.txt
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' artifact/apksigner-report.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$cert" = "$EXPECTED_CERT_SHA256"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifact/FlipCheck-v1.35-build157.apk | tee artifact/apk-analyzer-report.txt
          grep -q "package: name='$PACKAGE' versionCode='157' versionName='1.35-vision-web-review'" artifact/apk-analyzer-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FlipCheck-v1.35-build157-apk-only
          path: artifact/
          if-no-files-found: error
          retention-days: 14
