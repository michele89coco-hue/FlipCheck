plugins { alias(libs.plugins.android.application) }

android {
    namespace 'com.flipcheck.legacy26'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.flipcheck.beta.legacy26fix'
        minSdk 23
        targetSdk 36
        versionCode 199
        versionName '0.29.6-physical-details'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'SOURCE_COMMIT', '"' + (System.getenv('GIT_COMMIT') ?: 'local') + '"'
    }
    testBuildType 'release'
    buildFeatures { buildConfig true }
    signingConfigs {
        compatible {
            if (System.getenv('FLIPCHECK_KEYSTORE_PATH')) {
                storeFile file(System.getenv('FLIPCHECK_KEYSTORE_PATH'))
                storePassword System.getenv('FLIPCHECK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FLIPCHECK_KEY_ALIAS')
                keyPassword System.getenv('FLIPCHECK_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { if (System.getenv('FLIPCHECK_KEYSTORE_PATH')) signingConfig signingConfigs.compatible }
        release {
            debuggable false
            minifyEnabled false
            if (System.getenv('FLIPCHECK_KEYSTORE_PATH')) signingConfig signingConfigs.compatible
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.jsoup
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.mlkit:text-recognition-japanese:16.0.1"
    androidTestImplementation libs.junit
    androidTestImplementation libs.androidx.test.runner
}
