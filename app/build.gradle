plugins {
    alias(libs.plugins.android.application)
}

def compatibleKeystorePath = System.getenv('FLIPCHECK_KEYSTORE_PATH')
def compatibleKeystorePassword = System.getenv('FLIPCHECK_KEYSTORE_PASSWORD')
def compatibleKeyAlias = System.getenv('FLIPCHECK_KEY_ALIAS')
def compatibleKeyPassword = System.getenv('FLIPCHECK_KEY_PASSWORD')
def hasCompatibleSigning = compatibleKeystorePath && compatibleKeystorePassword && compatibleKeyAlias && compatibleKeyPassword
def sourceCommit = (System.getenv('GIT_COMMIT') ?: 'local-uncommitted').replaceAll('[^A-Za-z0-9._-]', '_')

android {
    namespace 'com.flipcheck.nativebeta'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.flipcheck.beta.nativev098.clean'
        minSdk 23
        targetSdk 36
        versionCode 140
        versionName '1.34-evidence-integrity'
        buildConfigField 'String', 'SOURCE_COMMIT', '"' + sourceCommit + '"'
        multiDexEnabled true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        compatibleDebug {
            if (hasCompatibleSigning) {
                storeFile file(compatibleKeystorePath)
                storePassword compatibleKeystorePassword
                keyAlias compatibleKeyAlias
                keyPassword compatibleKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            if (hasCompatibleSigning) {
                signingConfig signingConfigs.compatibleDebug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        test.java.srcDir rootProject.file('tools/regression')
        androidTest.assets.srcDir rootProject.file('tools/regression/fixtures/v132-real-images')
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.withType(Test).configureEach {
    workingDir rootProject.projectDir
    testLogging {
        events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
        showStandardStreams true
        showCauses true
        showStackTraces true
        exceptionFormat 'full'
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation libs.androidx.core
    // Modello OCR latino realmente incluso nell'APK: nessun download del modello al primo uso.
    implementation libs.mlkit.text.recognition
    // Barcode/QR realmente on-device, incluso nell'APK.
    implementation libs.mlkit.barcode.scanning
    // Ritaglio foreground on-device, usato solo come vista aggiuntiva e mai come unica prova.
    implementation libs.mlkit.object.detection
    // Estrazione conservativa delle immagini prodotto dalle pagine realmente recuperate.
    implementation libs.jsoup
    testImplementation libs.junit
    testImplementation libs.json
    androidTestImplementation libs.junit
    androidTestImplementation libs.androidx.test.runner
}
